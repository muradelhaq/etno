name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release App Bundle (AAB for Google Play)
        run: flutter build appbundle --release

      - name: Build Release APK
        run: flutter build apk --release

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Pembaruan E-Modul Etnosains (${{ github.ref_name }})
            
            - **Google Play Bundle:** `app-release.aab` (siap diunggah ke Google Play Console)
            - **Standalone APK:** `app-release.apk` (untuk pengujian langsung)
          draft: false
          prerelease: false
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
